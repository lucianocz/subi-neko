version: 2

updates:
    - package-ecosystem: pip
      directory: /backend
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Europe/Prague
      open-pull-requests-limit: 5
      groups:
          python-minor-patch:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /frontend
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Europe/Prague
      open-pull-requests-limit: 5
      groups:
          npm-minor-patch:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Europe/Prague
      open-pull-requests-limit: 5
      groups:
          actions:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: "09:00"
          timezone: Europe/Prague
      open-pull-requests-limit: 5
      groups:
          docker-minor-patch:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
