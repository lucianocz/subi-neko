          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonPublish'
  /api/v1/titles/{title_id}/episodes:
    put:
      operationId: publishFlatEpisodes
      tags:
      - Publish
      security:
      - PublishToken: []
      parameters:
      - name: title_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current snapshot; PUT outcomes updated or noop.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PublishResult'
                - properties:
                    outcome:
                      enum:
                      - updated
                      - noop
        '201':
          description: Created requested title/season, or at least one FLAT episode.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PublishResult'
                - properties:
                    outcome:
                      const: created
        '401':
          description: Sanitized error; never returns credentials or input values.
          content:
