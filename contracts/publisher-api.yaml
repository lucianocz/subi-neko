              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
        '404':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable or commit outcome uncertain; retry the identical request 
            with backoff. It may already have committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatPublish'
  /api/v1/titles/{title_id}/poster:
    put:
      tags:
      - Publish
      operationId: putPoster
      summary: Upload or replace title poster
      description: |-
        JPEG, PNG and WebP content is validated from actual bytes, independently of
        the declared file media type or filename suffix. At most 40 million decoded pixels
        across all frames. Identical current SHA-256 returns noop and preserves poster
        metadata. Changed bytes replace current_poster. The first poster returns 201/created;
        replacement returns 200/updated; identical current bytes return 200/noop.
        Title identity, metadata_fingerprint and metadata_updated_at remain unchanged.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PosterUpload'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: 'Existing current poster: updated for different image file bytes; noop for identical
            current bytes. Replacement preserves title identity and metadata freshness.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PosterResult'
                - properties:
                    outcome:
                      enum:
                      - updated
                      - noop
        '201':
          description: First current file for this target created (outcome created).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PosterResult'
                - properties:
                    outcome:
                      enum:
                      - created
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
        '404':
          description: Unknown entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Published content or resource identity conflict; no partial changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File exceeds configured byte limit, or request exceeds file limit plus 64 KiB 
            multipart overhead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported, empty, corrupted or invalid image content or request media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid multipart fields, filename or incomplete body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Publication unavailable or unexpected server error; no internal details exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable or commit outcome uncertain; retry the identical request 
            with backoff. It may already have committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: title_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - PublishToken: []
  /api/v1/episodes/{episode_id}/subtitles:
    put:
      tags:
      - Publish
      operationId: putSubtitle
      summary: Upload ASS subtitles for an episode
      description: |-
        SEASONED, FLAT and movie episodes share this endpoint. A valid UTF-8 ASS file
        (optional UTF-8 BOM) with a matching .ass filename suffix (case-insensitive) is required.
        ASS requires Script Info/ScriptType and Events/Format with a nonempty Dialogue and
        valid increasing start/end times. SHA-256 covers exact original bytes without text
        or newline normalization. Identical current SHA-256 returns noop and preserves all
        current revision metadata, including filename, release label, changelog and timestamp.
        Changed bytes create an immutable revision UUID and the next revision number.
        A -> B -> A creates three revisions. The first revision returns 201/created;
        subsequent changed bytes return 200/updated; identical current bytes return 200/noop.
        FLAT/movie episodes require no season. File uploads never change metadata_fingerprint
        or metadata_updated_at.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubtitleUpload'
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: 'Existing current file: updated for different bytes; noop for identical current bytes.
            Subtitle updated creates a new immutable revision.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SubtitleResult'
                - properties:
                    outcome:
                      enum:
                      - updated
                      - noop
        '201':
          description: First current file for this target created (outcome created).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SubtitleResult'
                - properties:
                    outcome:
                      enum:
                      - created
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
        '404':
          description: Unknown entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Published content or resource identity conflict; no partial changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File exceeds configured byte limit, or request exceeds file limit plus 64 KiB 
            multipart overhead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported, empty, corrupted or invalid ASS content, filename extension, encoding
            or request media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid multipart fields, filename or incomplete body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Publication unavailable or unexpected server error; no internal details exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable or commit outcome uncertain; retry the identical request 
            with backoff. It may already have committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: episode_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - PublishToken: []
components:
  securitySchemes:
    PublishToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Random shared publisher token; TLS required.
  parameters:
    TitleId:
      name: title_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid or unconfigured token. Includes WWW-Authenticate Bearer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
    NotFound:
      description: Parent title or stable Episode target does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Identity ownership conflict, alias rebinding, selected-order change, episode remapping
        or placement collision. No partial changes to this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Invalid metadata or IDs, mismatched media types, unsupported season-mapping kind for 
        the selected order, or invalid multipart fields or filename.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: File or request exceeds configured upload size limit (default file limit 25 MiB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unsupported:
      description: Invalid/unsupported file content, subtitle format or encoding; no new revision 
        created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Temporarily unavailable or commit outcome uncertain; retry the identical request with 
        backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error. No secrets or internal paths exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    EpisodeOrder:
      additionalProperties: false
      allOf:
      - else:
          properties:
            group_id:
              type: 'null'
        if:
          properties:
            kind:
              const: episode_group
        then:
          properties:
            group_id:
              minLength: 1
              type: string
          required:
          - group_id
      properties:
        provider:
          default: tmdb
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          title: Provider
          type: string
        kind:
          enum:
          - standard
          - episode_group
          title: Kind
          type: string
        group_id:
          anyOf:
          - maxLength: 255
            minLength: 1
            pattern: \S
            type: string
          - type: 'null'
          default: null
          title: Group Id
      required:
      - kind
      title: EpisodeOrder
      type: object
    ProviderMapping:
      additionalProperties: false
      properties:
        provider:
          pattern: ^[a-z][a-z0-9_-]{0,31}$
          title: Provider
          type: string
        media_type:
          enum:
          - tv
          - movie
          title: Media Type
          type: string
        external_id:
          maxLength: 255
          minLength: 1
          pattern: \S
          title: External Id
          type: string
      required:
      - provider
      - media_type
      - external_id
      title: ProviderMapping
      type: object
    TitlePublish:
      additionalProperties: false
      allOf:
      - if:
          properties:
            media_type:
              const: movie
        then:
          properties:
            episode_structure:
              const: FLAT
            episode_order:
              properties:
                kind:
                  const: standard
      properties:
        mappings:
          items:
            $ref: '#/components/schemas/ProviderMapping'
          maxItems: 100
          minItems: 1
          title: Mappings
          type: array
        media_type:
          enum:
          - tv
