        '503':
          description: Temporarily unavailable or commit outcome uncertain; retry the identical request 
            with backoff. It may already have committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateTitle
      tags:
      - Publish
      security:
      - PublishToken: []
      parameters:
      - name: title_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current snapshot; PUT outcomes updated or noop.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PublishResult'
                - properties:
                    outcome:
                      enum:
                      - updated
                      - noop
        '401':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
