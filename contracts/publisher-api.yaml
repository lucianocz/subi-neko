    - name_english
    - year
    - episodes
    episode:
    - mappings
    - publisher_key
    - episode_number
    - name_english
  array_order: Mappings sorted by provider/media_type/kind/external_id; seasons by number DESC then 
    canonical mappings; episodes by number DESC then canonical mappings/publisher_key. Structural nesting
    represents placement; no UUIDs projected.
