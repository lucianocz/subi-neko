openapi: 3.1.0
info:
  title: Subi-neko Publisher API
  version: 1.0.0
  description: |
    Defines the HTTP contract for websites receiving publications from Subi-neko. A compatible receiver MUST implement the documented routes, schemas, identity and conflict rules, authentication, response semantics, and retry behavior. Internal storage and deployment are not specified.

    Resources and identities
    - Resources follow Title -> optional Season -> Episode -> SubtitleRevision. Target-issued UUIDs identify existing resources; external provider mappings are unique lookup aliases, not resource paths.
    - Movies use FLAT structure and standard episode order. SEASONED titles require seasons; FLAT titles publish episodes directly. Media type, episode structure, and selected episode order cannot change after creation.
    - Title and episode mappings remain attached to their resources. Aliases may be added but not removed or rebound. Existing episodes cannot move to another title or season or change publisher_key. Episode number/name updates preserve identity.
    - SEASONED episodes require TMDB episode IDs. FLAT episodes without a TMDB episode ID require a stable title-scoped publisher_key. Episode UUIDs supplied in batches must reference existing episodes.
    - Deletion and recovery are outside this API. If resources are deleted externally, their UUIDs and related counters do not survive recreation.

    Metadata updates
    - PUT collection requests are additive, atomic upserts: omitted children and mappings are preserved. Optional descriptive fields on an included entity default to null; title_romaji defaults to title_english. Duplicate resolved identities in a request return 409 without partial changes.
    - 201 denotes creation and 200 denotes update or noop. Season publication returns created only for a new season; FLAT publication returns created if at least one episode is new. Metadata mutation responses include the current title snapshot.
    - Results order seasons by season_number DESC and episodes by episode_number DESC, with stable external-identity tie-breakers. Reads expose current poster and subtitle summaries, not historical revisions.
    - metadata_fingerprint is SHA-256 of the RFC8785 canonical metadata projection described in x-metadata-fingerprint. UUIDs, file content/summaries, counters, and timestamps are excluded. metadata_updated_at advances only when effective projected metadata changes. Uploads do not change either value.

    Authentication and failures
    - All operations require HTTPS and Authorization: Bearer <token>. Missing or invalid authentication returns 401 with WWW-Authenticate: Bearer; website sessions cannot replace the token.
    - Invalid JSON (including duplicate keys or invalid Unicode) returns 422; unknown resources return 404; identity/structure conflicts return 409. The documented error envelope is used without revealing secrets or internal details.
    - After a 503 or unknown network outcome, retry the identical request with bounded backoff: the first attempt may have committed. Identical current state returns noop, but intervening writes may change the outcome. No idempotency-key header or permanent deduplication record is defined. Resolve 401, 404, 409, 413, 415, and 422 failures before retrying.

    File uploads
    - Multipart uploads contain one file and only documented fields; duplicate/unknown fields return 422. Filenames are metadata, must be nonblank (up to 255 characters), and cannot contain path separators, drive delimiters, or control characters.
    - release_label must be nonblank (max 200 characters); changelog is optional (max 4000 characters), with omitted and empty values distinguished. Empty files return 415. The default upload limit is 25 MiB per file plus 64 KiB multipart overhead; receivers must communicate any different configured limit.
    - SHA-256 compares exact bytes. Identical current files return noop without changing existing revision metadata; changed subtitle bytes create a new revision, including when reverting to previously published bytes. Failed/uncommitted uploads do not replace current published content. A successful response confirms the published result.

servers:
- url: https://publisher-api.example.invalid
  description: Configure the receiver HTTPS origin; paths already include /api/v1.
security:
- PublishToken: []
tags:
- name: Publish
paths:
  /api/v1/titles:
    get:
      operationId: lookupTitle
      tags:
      - Publish
      security:
      - PublishToken: []
      parameters:
      - name: provider
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,31}$
      - name: media_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - tv
          - movie
      - name: external_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '200':
          description: Current aggregate title snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleSnapshot'
        '401':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
        '404':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable or commit outcome uncertain; retry the identical request 
            with backoff. It may already have committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: publishTitle
      tags:
      - Publish
      security:
      - PublishToken: []
      parameters: []
      responses:
        '200':
          description: Current snapshot; PUT outcomes updated or noop.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PublishResult'
                - properties:
                    outcome:
                      enum:
                      - updated
                      - noop
        '201':
          description: New title created (outcome created).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PublishResult'
                - properties:
                    outcome:
                      const: created
        '401':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
        '404':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Sanitized error; never returns credentials or input values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporarily unavailable or commit outcome uncertain; retry the identical request 
            with backoff. It may already have committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TitlePublish'
